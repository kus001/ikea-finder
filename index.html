<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GTA IKEA Ultimate Meatball Radar 🧆</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0058a3; /* IKEA Blue */
      color: #111111;
      margin: 0;
      padding: 20px;
      padding-bottom: 100px; /* Space for compass HUD */
      display: flex;
      justify-content: center;
    }

    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #0058a3;
      margin-top: 0;
      text-align: center;
    }

    .btn {
      background-color: #ffda1a;
      color: #0058a3;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
    }

    .btn:hover {
      background-color: #e6c317;
    }

    #map {
      height: 300px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    .calculator {
      background: #f4f4f4;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    .calculator input, .calculator select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .store-card {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }

    .store-card.closest {
      border-color: #0058a3;
      background-color: #f0f7fc;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      color: white;
    }

    .open { background-color: #2e7d32; }
    .closed { background-color: #c62828; }

    a.nav-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background-color: #0058a3;
      color: #ffda1a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* Floating Compass HUD */
    .compass-hud {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      border: 4px solid #0058a3;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      display: none; /* Shows after clicking locate */
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .compass-arrow {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 35px solid #cc0000; /* Red arrow tip */
      position: absolute;
      transform-origin: 50% 100%;
      top: 8px;
      transition: transform 0.1s ease-out;
    }

    .compass-arrow::after {
      content: '';
      position: absolute;
      left: -10px;
      top: 35px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🧆 IKEA Meatball Radar</h1>
    <p style="text-align: center;">Locate stores, check live status, and calculate your feast.</p>
    
    <button class="btn" id="locateBtn" onclick="findNearestIKEA()">FIND STORES NEAR ME</button>

    <div id="map"></div>

    <div id="resultsList"></div>

    <div class="calculator">
      <h3>🧆 Meatball Calculator</h3>
      <label>How many people?</label>
      <input type="number" id="peopleCount" value="2" min="1" onchange="calculateMeatballs()" />

      <label>Hunger Level:</label>
      <select id="hungerLevel" onchange="calculateMeatballs()">
        <option value="8">Light (8 meatballs/person)</option>
        <option value="12" selected>Moderate (12 meatballs/person)</option>
        <option value="20">Starving (20 meatballs/person)</option>
      </select>

      <div id="calcOutput"><strong>Total needed:</strong> 24 meatballs, 2 soft serves!</div>
    </div>
  </div>

  <div class="compass-hud" id="compassHud" title="Pointing to nearest IKEA">
    <div class="compass-arrow" id="compassArrow"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const ikeaStores = [
      { name: "IKEA Downtown Toronto", lat: 43.677007, lon: -79.384942, open: 10, close: 20 },
      { name: "IKEA North York", lat: 43.800863, lon: -79.367466, open: 10, close: 21 },
      { name: "IKEA Vaughan", lat: 43.797286, lon: -79.533468, open: 10, close: 21 },
      { name: "IKEA Etobicoke", lat: 43.632531, lon: -79.548334, open: 10, close: 21 },
      { name: "IKEA Burlington", lat: 43.346227, lon: -79.823796, open: 10, close: 21 }
    ];

    let map = null;
    let targetBearing = 0;

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))); 
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * (Math.PI / 180);
      const toDeg = rad => rad * (180 / Math.PI);

      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function isStoreOpen(openHour, closeHour) {
      const currentHour = new Date().getHours();
      return currentHour >= openHour && currentHour < closeHour;
    }

    function findNearestIKEA() {
      const btn = document.getElementById('locateBtn');

      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      btn.innerText = "Locating...";
      btn.disabled = true;

      navigator.geolocation.getCurrentPosition((position) => {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        // Calculate distance & times for all stores
        const storesWithData = ikeaStores.map(store => {
          const dist = calculateDistance(userLat, userLon, store.lat, store.lon);
          const driveTime = Math.round((dist / 40) * 60); 
          const isOpen = isStoreOpen(store.open, store.close);
          return { ...store, distance: dist, driveTime, isOpen };
        });

        // Sort by distance
        storesWithData.sort((a, b) => a.distance - b.distance);

        const closest = storesWithData[0];
        targetBearing = calculateBearing(userLat, userLon, closest.lat, closest.lon);

        // Render List & Map
        renderStoresList(storesWithData);
        renderMap(userLat, userLon, storesWithData);
        startCompassHUD();

        btn.innerText = "REFRESH LOCATION";
        btn.disabled = false;
      }, () => {
        alert("Location access denied!");
        btn.innerText = "FIND STORES NEAR ME";
        btn.disabled = false;
      });
    }

    function startCompassHUD() {
      document.getElementById('compassHud').style.display = 'flex';

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        });
      } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true) ||
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function handleOrientation(event) {
      let compassHeading = null;

      if (event.webkitCompassHeading) {
        compassHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        compassHeading = 360 - event.alpha;
      }

      if (compassHeading !== null) {
        const arrowDegree = targetBearing - compassHeading;
        document.getElementById('compassArrow').style.transform = `rotate(${arrowDegree}deg)`;
      }
    }

    function renderStoresList(stores) {
      const listDiv = document.getElementById('resultsList');
      listDiv.innerHTML = "<h3>Nearest Locations:</h3>";

      stores.forEach((store, idx) => {
        const isClosest = idx === 0;
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${store.lat},${store.lon}`;
        
        listDiv.innerHTML += `
          <div class="store-card ${isClosest ? 'closest' : ''}">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong>${isClosest ? '🥇 ' : ''}${store.name}</strong>
              <span class="badge ${store.isOpen ? 'open' : 'closed'}">
                ${store.isOpen ? 'OPEN NOW' : 'CLOSED'}
              </span>
            </div>
            <p style="margin: 5px 0; font-size: 0.95rem;">
              📍 <strong>${store.distance.toFixed(1)} km</strong> away (~${store.driveTime} min drive)
            </p>
            <a class="nav-btn" href="${mapsUrl}" target="_blank">Get Directions 🚗</a>
          </div>
        `;
      });
    }

    function renderMap(userLat, userLon, stores) {
      const mapDiv = document.getElementById('map');
      mapDiv.style.display = 'block';

      if (map) map.remove(); 

      map = L.map('map').setView([userLat, userLon], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.marker([userLat, userLon]).addTo(map)
        .bindPopup("<b>You are here!</b>")
        .openPopup();

      stores.forEach(store => {
        L.marker([store.lat, store.lon]).addTo(map)
          .bindPopup(`<b>${store.name}</b><br>${store.distance.toFixed(1)} km away`);
      });
    }

    function calculateMeatballs() {
      const people = document.getElementById('peopleCount').value || 1;
      const hunger = document.getElementById('hungerLevel').value;
      const totalMeatballs = people * hunger;
      const totalIceCream = people;

      document.getElementById('calcOutput').innerHTML = 
        `<strong>Total needed:</strong> ${totalMeatballs} meatballs & ${totalIceCream} soft serve cone(s)!`;
    }
  </script>
</body>
</html>
